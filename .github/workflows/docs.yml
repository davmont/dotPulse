# Documentation website (website/, built with Zensical from website/mkdocs.yml): built on every change, published to
# GitHub Pages (www.dotpulse.org) from master, so the site matches the latest release.
# A manual run (Run workflow) publishes the chosen branch, if the github-pages environment
# allows that branch.
name: Docs

on:
  push:
    branches: [devel, master]
    paths: ['website/**', '.github/workflows/docs.yml', 'tools/checks/check-doc-images.py']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml', 'tools/checks/check-doc-images.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Zensical's --strict does not report missing images.
      - name: Images exist
        run: python3 tools/checks/check-doc-images.py
      # --strict: a broken link or a missing page fails the build. The image is pinned by
      # digest; update it together with the Makefile (ZENSICAL_IMAGE).
      - name: Build
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/website:/docs"
          zensical/zensical:0.1.2@sha256:e1795a2c63b07174d91053f3598d2192032ea88b62a93fcd60be78ed3d5c4aa7 build --strict --clean
      # The Spanish site, into site/es/, with the stylesheet and logo of docs/ (see the Makefile).
      - name: Build (Spanish)
        run: |
          rm -rf website/docs-es/stylesheets website/docs-es/assets
          cp -r website/docs/stylesheets website/docs/assets website/docs-es/
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/website:/docs" \
            zensical/zensical:0.1.2@sha256:e1795a2c63b07174d91053f3598d2192032ea88b62a93fcd60be78ed3d5c4aa7 build --strict --clean -f mkdocs.es.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          path: website/site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
