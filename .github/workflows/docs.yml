# Documentation website (website/, MkDocs Material): built on every change, published to
# GitHub Pages (www.dotpulse.org) from master, so the site matches the latest release.
# A manual run (Run workflow) publishes the chosen branch, if the github-pages environment
# allows that branch.
name: Docs

on:
  push:
    branches: [devel, master]
    paths: ['website/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the documentation website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --strict: a broken link or a missing page fails the build.
      - name: Build
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/website:/docs"
          squidfunk/mkdocs-material:9.6.14 build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          path: website/site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
